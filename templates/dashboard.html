<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGFF Futter-Dashboard</title>
    <base href="/futter/">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

    <script>
        async function verifyAdminPassword(pwd) {
            try {
                const response = await fetch('api/admin/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Pass': pwd },
                    body: '{}'
                });
                return response.ok;
            } catch (e) {
                return false;
            }
        }

        const FUTTERART_FARBEN = {
            'Wiesenfutter': 'rgba(0, 158, 115, 1)',
            'Silomais': 'rgba(230, 159, 0, 1)',
            'Ganzpflanzensilage (GPS)': 'rgba(0, 120, 186, 1)',
            'Zuckerrüben-Schnitzel': 'rgba(213, 94, 0, 1)',
            'Malztreber': 'rgba(86, 180, 233, 1)',
            'Unbekannt': 'rgba(128, 128, 128, 1)'
        };
        const STANDARD_FARBE = 'rgba(128, 128, 128, 1)';

        let alleProben = [];
        let selectedSample = null;
        let tableSort = { key: 'probeNr', dir: 'asc' };
        let tableFilters = {};
        let inputTableSort = { key: 'probeNr', dir: 'asc' };
        let inputTableFilters = {};
        let summaryRows = [];
        let summaryTableSort = { key: 'probeNr', dir: 'asc' };
        let summaryTableFilters = {};
        let outlierReviewerSet = new Set();
        let prefixOptions = [];
        let editMode = false;
        let reviewerOptions = [];
        let fitAllOnScreen = false;

        document.addEventListener('DOMContentLoaded', async () => {
            showLoading(true, "Lade Daten vom Server...");

            loadDashboardSettings();
            
            // Event Listener UI
            setupEventListeners();

            // Admin Auto-Login (Gerät)
            const storedAdminPass = localStorage.getItem('agffAdminPass');
            if (storedAdminPass && await verifyAdminPassword(storedAdminPass)) {
                document.getElementById('admin-passwort').value = storedAdminPass;
                document.getElementById('admin-unlock-wrapper').classList.add('hidden');
                document.getElementById('admin-wrapper').classList.remove('hidden');
                localStorage.setItem('agffAdminUnlocked', '1');
                const bf = document.getElementById('filter-beurteiler');
                if (bf) bf.classList.remove('hidden');
            } else if (storedAdminPass) {
                localStorage.removeItem('agffAdminPass');
                localStorage.removeItem('agffAdminUnlocked');
            }
            
            // Daten laden
            await loadData();
        });

        // --- DATEN LADEN (PYTHON API) ---
        async function loadData() {
            try {
                // API Aufruf an Flask
                const response = await fetch('api/proben'); // Relativer Pfad!
                if (!response.ok) throw new Error("Server Fehler beim Laden");
                
                alleProben = await response.json();
                console.log(`${alleProben.length} Proben geladen.`);
                updatePrefixOptions();
                updateReviewerOptions();
                updateChart();
                await loadSummaryData();
                showLoading(false);
            } catch (e) {
                console.error(e);
                showLoading(false, "Fehler: " + e.message, true);
            }
        }

        async function loadSummaryData() {
            try {
                const response = await fetch('api/results/summary');
                if (!response.ok) throw new Error("Server Fehler beim Laden");
                summaryRows = await response.json();
                renderSummaryTable(summaryRows || []);
            } catch (e) {
                summaryRows = [];
                renderSummaryTable([]);
            }
        }

        // --- ADMIN FUNKTIONEN ---
        // Wir senden das Passwort im Header 'X-Admin-Pass'
        
        async function apiAdminRequest(endpoint, payload) {
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Pass': document.getElementById('admin-passwort').value
                    },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (e) {
                return { error: e.message };
            }
        }

        async function handleDeleteProbe() {
            const probeNr = document.getElementById('admin-delete-probe-nr').value.trim();
            const statusEl = document.getElementById('admin-status');
            if(!probeNr) return;

            // Einfacher Bestätigungs-Check
            if(!confirm(`Probe '${probeNr}' wirklich löschen?`)) return;

            statusEl.textContent = "Lösche...";
            const res = await apiAdminRequest('api/admin/delete', { probeNr });
            
            if (res.error) {
                statusEl.textContent = "Fehler: " + res.error;
                statusEl.className = "text-xs text-red-600";
            } else {
                statusEl.textContent = "Gelöscht!";
                statusEl.className = "text-xs text-green-600";
                loadData(); // Neu laden
            }
        }

        async function handleUpdatePrefix(action) {
            const prefix = document.getElementById(action === 'remove' ? 'admin-remove-prefix' : (action === 'swap' ? 'admin-swap-prefix-new' : 'admin-add-prefix')).value.trim();
            const oldPrefix = action === 'swap' ? document.getElementById('admin-swap-prefix-old').value.trim() : null;
            const statusEl = document.getElementById('admin-status');

            statusEl.textContent = "Arbeite...";
            const res = await apiAdminRequest('api/admin/prefix', { action, prefix, oldPrefix });

            if (res.error) {
                statusEl.textContent = "Fehler: " + res.error;
                statusEl.className = "text-xs text-red-600";
            } else {
                statusEl.textContent = "Fertig! Aktualisiert.";
                statusEl.className = "text-xs text-green-600";
                loadData();
            }
        }

        async function handleRenameProbe() {
            const oldProbe = document.getElementById('admin-rename-probe-old').value.trim();
            const newProbe = document.getElementById('admin-rename-probe-new').value.trim();
            const statusEl = document.getElementById('admin-status');

            if (!oldProbe || !newProbe) return;
            if (!confirm(`Probe '${oldProbe}' wirklich umbenennen in '${newProbe}'?`)) return;

            statusEl.textContent = "Arbeite...";
            const res = await apiAdminRequest('api/admin/rename', { oldProbe, newProbe });

            if (res.error) {
                statusEl.textContent = "Fehler: " + res.error;
                statusEl.className = "text-xs text-red-600";
            } else {
                statusEl.textContent = "Fertig! Umbenannt.";
                statusEl.className = "text-xs text-green-600";
                loadData();
            }
        }

        // --- UI & CHARTS (Rest fast identisch zu vis.html) ---
        
        function setupEventListeners() {
            // Filter Change Events
            ['filter-metrik', 'filter-gruppe', 'filter-futterart', 'filter-aufwuchs', 'filter-konservierung', 'filter-bestand', 'filter-probe-suffix', 'filter-chart-mode'].forEach(id => {
                document.getElementById(id)?.addEventListener('change', () => {
                    saveDashboardSettings();
                    updateChart();
                });
            });
            document.getElementById('filter-beurteiler')?.addEventListener('change', () => {
                saveDashboardSettings();
                updateChart();
            });
            const prefixInput = document.getElementById('filter-prefix');
            const prefixMenu = document.getElementById('filter-prefix-menu');
            prefixInput?.addEventListener('input', () => {
                saveDashboardSettings();
                updateChart();
                renderPrefixMenu(prefixInput.value);
                showPrefixMenu(true);
            });
            prefixInput?.addEventListener('focus', () => {
                renderPrefixMenu(prefixInput.value);
                showPrefixMenu(true);
            });
            prefixInput?.addEventListener('blur', () => {
                setTimeout(() => showPrefixMenu(false), 150);
            });
            prefixMenu?.addEventListener('mousedown', (e) => {
                const item = e.target.closest('[data-prefix-value]');
                if (!item) return;
                prefixInput.value = item.getAttribute('data-prefix-value') || '';
                saveDashboardSettings();
                updateChart();
                showPrefixMenu(false);
            });

            // Admin Unlock
            document.getElementById('admin-unlock-btn').addEventListener('click', async () => {
                const pwd = document.getElementById('admin-passwort').value;
                if(await verifyAdminPassword(pwd)) {
                    document.getElementById('admin-unlock-wrapper').classList.add('hidden');
                    document.getElementById('admin-wrapper').classList.remove('hidden');
                    localStorage.setItem('agffAdminPass', pwd);
                    localStorage.setItem('agffAdminUnlocked', '1');
                    const bf = document.getElementById('filter-beurteiler');
                    if (bf) bf.classList.remove('hidden');
                } else {
                    document.getElementById('admin-unlock-status').textContent = "Falsch";
                }
            });

            // Admin Buttons
            document.getElementById('btn-delete-probe').addEventListener('click', handleDeleteProbe);
            document.getElementById('btn-rename-probe').addEventListener('click', handleRenameProbe);
            document.getElementById('btn-swap-prefix').addEventListener('click', () => handleUpdatePrefix('swap'));
            document.getElementById('edit-close').addEventListener('click', closeEditModal);
            document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
            document.getElementById('edit-save').addEventListener('click', saveEditModal);
            document.getElementById('edit-archive').addEventListener('click', archiveEditModal);
            document.getElementById('edit-delete').addEventListener('click', deleteEditModal);
            document.getElementById('edit-toggle').addEventListener('click', () => {
                setEditMode(!editMode);
            });
            document.getElementById('edit-modal').addEventListener('click', (e) => {
                if (e.target.id === 'edit-modal') closeEditModal();
            });

            document.getElementById('edit-section-probeinfos-btn').addEventListener('click', () => toggleEditSection('probeinfos'));
            document.getElementById('edit-section-beurteilung-btn').addEventListener('click', () => toggleEditSection('beurteilung'));
            document.getElementById('edit-futterart').addEventListener('change', updateEditFutterartVisibility);
            const editAufwuchsNr = document.getElementById('edit-aufwuchs_nr');
            if (editAufwuchsNr) {
                editAufwuchsNr.addEventListener('input', () => normalizeIntegerInputValue('edit-aufwuchs_nr'));
                editAufwuchsNr.addEventListener('change', () => normalizeIntegerInputValue('edit-aufwuchs_nr'));
            }
            document.getElementById('edit-aufwuchs-nr-minus')?.addEventListener('click', () => adjustIntegerField('edit-aufwuchs_nr', -1));
            document.getElementById('edit-aufwuchs-nr-plus')?.addEventListener('click', () => adjustIntegerField('edit-aufwuchs_nr', 1));

            document.getElementById('chart-fullscreen-btn').addEventListener('click', toggleChartFullscreen);
            document.getElementById('chart-count').addEventListener('click', toggleFitAllOnScreen);
            document.addEventListener('fullscreenchange', () => {
                const container = document.getElementById('chart-container');
                if (container && window.Plotly) {
                    Plotly.Plots.resize(container);
                }
            });
            
            // Accordion Admin
            document.getElementById('admin-accordion-toggle').addEventListener('click', () => {
                 document.getElementById('admin-accordion-content').classList.toggle('hidden');
            });

            document.getElementById('data-table-toggle').addEventListener('click', () => {
                document.getElementById('data-table-content').classList.toggle('hidden');
                document.getElementById('data-table-icon').classList.toggle('rotate-180');
            });
            document.getElementById('input-table-toggle').addEventListener('click', () => {
                document.getElementById('input-table-content').classList.toggle('hidden');
                document.getElementById('input-table-icon').classList.toggle('rotate-180');
            });
            document.getElementById('summary-table-toggle').addEventListener('click', () => {
                document.getElementById('summary-table-content').classList.toggle('hidden');
                document.getElementById('summary-table-icon').classList.toggle('rotate-180');
            });

        }

        function loadDashboardSettings() {
            try {
                const raw = localStorage.getItem('agffDashboardSettings');
                if (!raw) return;
                const s = JSON.parse(raw);

                const setVal = (id, val) => {
                    const el = document.getElementById(id);
                    if (!el || val === undefined || val === null) return;
                    if (el.type === 'checkbox') el.checked = Boolean(val);
                    else el.value = val;
                };

                setVal('filter-metrik', s.filterMetrik);
                setVal('filter-gruppe', s.filterGruppe);
                setVal('filter-prefix', s.filterPrefix);
                setVal('filter-probe-suffix', s.filterProbeSuffix);
                setVal('filter-beurteiler', s.filterBeurteiler);
                setVal('filter-chart-mode', s.filterChartMode);
                setVal('filter-futterart', s.filterFutterart);
                setVal('filter-aufwuchs', s.filterAufwuchs);
                setVal('filter-konservierung', s.filterKonservierung);
                setVal('filter-bestand', s.filterBestand);

                if (typeof s.fitAllOnScreen === 'boolean') {
                    fitAllOnScreen = s.fitAllOnScreen;
                    const countEl = document.getElementById('chart-count');
                    if (countEl) countEl.classList.toggle('font-semibold', fitAllOnScreen);
                }

            } catch (e) {
                console.warn('Settings load failed', e);
            }
        }

        function saveDashboardSettings() {
            try {
                const s = {
                    filterMetrik: document.getElementById('filter-metrik')?.value,
                    filterGruppe: document.getElementById('filter-gruppe')?.value,
                    filterPrefix: document.getElementById('filter-prefix')?.value,
                    filterProbeSuffix: document.getElementById('filter-probe-suffix')?.checked,
                    filterBeurteiler: document.getElementById('filter-beurteiler')?.value,
                    filterChartMode: document.getElementById('filter-chart-mode')?.value,
                    filterFutterart: document.getElementById('filter-futterart')?.value,
                    filterAufwuchs: document.getElementById('filter-aufwuchs')?.value,
                    filterKonservierung: document.getElementById('filter-konservierung')?.value,
                    filterBestand: document.getElementById('filter-bestand')?.value,
                    fitAllOnScreen
                };
                localStorage.setItem('agffDashboardSettings', JSON.stringify(s));
            } catch (e) {
                console.warn('Settings save failed', e);
            }
        }

        function updateChart() {
            const container = document.getElementById('chart-container');
            const countEl = document.getElementById('chart-count');
            if(!alleProben.length) {
                container.innerHTML = "Keine Daten.";
                if (countEl) countEl.textContent = "0 Beurteilungen";
                return;
            }

            const yKey = document.getElementById('filter-metrik').value;
            const xKey = document.getElementById('filter-gruppe').value;
            const filterPrefix = document.getElementById('filter-prefix').value.trim();
            const showProbeSuffix = document.getElementById('filter-probe-suffix').checked;
            const isAdmin = localStorage.getItem('agffAdminUnlocked') === '1';
            const filterBeurteiler = document.getElementById('filter-beurteiler').value.trim();
            const chartMode = document.getElementById('filter-chart-mode').value;
            const filterFutterart = document.getElementById('filter-futterart').value;
            
            // Filtern
            const filtered = alleProben.filter(p => {
                // Präfix Filter
                if (filterPrefix && !p.probeNr.startsWith(filterPrefix)) return false;

                if (filterBeurteiler && (p.beurteiler || '') !== filterBeurteiler) return false;

                if (filterFutterart !== 'alle' && (p.futterart || 'Unbekannt') !== filterFutterart) return false;

                // Dropdown Filter (vereinfacht)
                const fAuf = document.getElementById('filter-aufwuchs').value;
                if(fAuf !== 'alle' && p.aufwuchs !== fAuf) return false;
                
                const fKons = document.getElementById('filter-konservierung').value;
                if(fKons !== 'alle' && p.konservierung !== fKons) return false;

                const fBest = document.getElementById('filter-bestand').value;
                if(fBest !== 'alle' && p.bestand !== fBest) return false;

                return true;
            });

            if(!filtered.length) {
                container.innerHTML = "Keine Daten für Filter.";
                if (countEl) countEl.textContent = "0 Beurteilungen";
                Plotly.purge(container);
                return;
            }
            container.innerHTML = "";
            if (countEl) countEl.textContent = `${filtered.length} Beurteilungen`;

            outlierReviewerSet = new Set();

            // Gruppieren für Farben
            const traces = [];
            const types = [...new Set(filtered.map(p => p.futterartLabel || p.futterart || 'Unbekannt'))];

            const getXValue = (p) => {
                if (xKey === 'probeNr') {
                    const v = showProbeSuffix ? getProbeNrSuffix(p.probeNr) : p.probeNr;
                    return String(v ?? '');
                }
                if (xKey === 'futterartAufwuchs') {
                    const futter = p.futterartLabel || p.futterart || 'Unbekannt';
                    const auf = labelAufwuchs(p.aufwuchs);
                    return `${futter} • ${auf}`;
                }
                return p[xKey];
            };

            const futterOrder = ['Wiesenfutter', 'Silomais', 'Ganzpflanzensilage (GPS)', 'Zuckerrüben-Schnitzel', 'Malztreber', 'Unbekannt'];
            const aufwuchsOrder = ['1. Aufwuchs', 'Folgeaufwuchs', 'Unbekannt'];

            const xCategoryArray = (xKey === 'probeNr' || xKey === 'futterartAufwuchs')
                ? (xKey === 'probeNr'
                    ? [...new Set(filtered.map(p => String(getXValue(p))))]
                    : futterOrder.flatMap(f =>
                        aufwuchsOrder.map(a => `${f} • ${a}`).filter(label =>
                            filtered.some(p => String(getXValue(p)) === label)
                        )
                    )
                  )
                : undefined;

            const catCount = xCategoryArray ? xCategoryArray.length : 0;
            let plotWidth = catCount ? Math.max(900, catCount * 60) : undefined;
            if (fitAllOnScreen) {
                plotWidth = undefined;
                container.style.minWidth = '';
            } else if (plotWidth) {
                container.style.minWidth = `${plotWidth}px`;
            } else {
                container.style.minWidth = '';
            }


            // --- Draw box/violin traces grouped by Aufwuchs symbol, so diamonds (N2+) are last ---
            // Helper to get Aufwuchs order: N1 (circle), N2+ (diamond), Unbekannt (square)
            const aufwuchsSymbolOrder = [
                { value: 'erster', symbol: 'square', label: 'N1' },
                { value: 'folge', symbol: 'diamond', label: 'N2+' },
                { value: 'unbekannt', symbol: 'circle', label: 'Unbekannt' }
            ];

            types.forEach(typ => {
                const groupData = filtered.filter(p => (p.futterartLabel || p.futterart || 'Unbekannt') === typ);
                const color = FUTTERART_FARBEN[typ] || STANDARD_FARBE;
                const customData = groupData.map(p => ({
                    ...p,
                    aufwuchsLabel: labelAufwuchs(p.aufwuchs)
                }));
                const hovertemplate = (
                    '<b>%{customdata.probeNr}</b>'
                    + (isAdmin ? '<br>Beurteiler: %{customdata.beurteiler}' : '')
                    + '<br>Aufwuchs: %{customdata.aufwuchsLabel}'
                    + '<br>Bestandestyp: %{customdata.bestand}'
                    + '<br>Stadium: %{customdata.eingaben.stadium}'
                    + '<br><b>NEL: %{customdata.effektiveWerte.nel:.2f} MJ/kg TS</b>'
                    + '<br>NEV: %{customdata.effektiveWerte.nev:.2f} MJ/kg TS'
                    + '<br>APDE: %{customdata.effektiveWerte.apde:.2f} g/kg TS'
                    + '<br>APDN: %{customdata.effektiveWerte.apdn:.2f} g/kg TS'
                    + '<br>MPP (limitierend): %{customdata.mpp:.2f} kg ECM (%{customdata.ergebnisse.limit})'
                    + '<extra></extra>'
                );

                if (chartMode === 'mean-ci') {
                    const xValues = xCategoryArray || [...new Set(groupData.map(p => getXValue(p)))];
                    const yMeans = [];
                    const yErrors = [];
                    const xOut = [];

                    xValues.forEach(xv => {
                        const vals = groupData
                            .filter(p => getXValue(p) === xv)
                            .map(p => getValue(p, yKey));
                        const { mean, ci, n } = meanAndCi(vals);
                        if (n > 0) {
                            xOut.push(xv);
                            yMeans.push(mean);
                            yErrors.push(ci);
                        }
                    });

                    traces.push({
                        x: xOut,
                        y: yMeans,
                        type: 'scatter',
                        mode: 'markers',
                        name: typ,
                        marker: { color: color, size: 12, symbol: 'circle', line: { color: '#111', width: 2 } },
                        error_y: { type: 'data', array: yErrors, visible: true, thickness: 2.5, width: 8, color },
                        hovertemplate: '<b>%{x}</b><br>Mittelwert: %{y:.2f}<extra></extra>'
                    });
                } else {
                    // Draw each Aufwuchs symbol group as a separate trace, in order: circle, diamond, square
                    let legendAdded = {};
                    aufwuchsSymbolOrder.forEach(({ value, symbol, label }) => {
                        const dataForSymbol = groupData.filter(p => markerSymbolForAufwuchs(p.aufwuchs) === symbol);
                        if (!dataForSymbol.length) return;
                        const markerColors = dataForSymbol.map(p => (p.eingaben && p.eingaben.eigene_probe === true) ? '#111' : withAlpha(color, 0.9));
                        // Only show legend for first occurrence of type/symbol
                        const legendKey = typ + '_' + symbol;
                        const showLegend = !legendAdded[legendKey];
                        legendAdded[legendKey] = true;
                        traces.push({
                            y: dataForSymbol.map(p => getValue(p, yKey)),
                            x: dataForSymbol.map(p => getXValue(p)),
                            type: 'box',
                            name: typ,
                            boxpoints: 'all',
                            whiskerwidth: 0,
                            box: { visible: true, line: { width: 2 } },
                            boxmean: true,
                            meanline: { visible: true, width: 4, color: '#111' },
                            marker: {
                                color: markerColors,
                                size: 9,
                                opacity: 0.9,
                                line: { color: '#2d2d2d', width: 1 },
                                symbol: symbol
                            },
                            fillcolor: withAlpha(color, 0.2),
                            line: { color: color, width: 2 },
                            customdata: dataForSymbol.map(p => ({
                                ...p,
                                aufwuchsLabel: labelAufwuchs(p.aufwuchs)
                            })),
                            hovertemplate: hovertemplate,
                            showlegend: showLegend
                        });
                    });

                    // Mittelwert-Punkte wieder anzeigen: Standardmarker (circle)
                    // Mittelwert-Punkte neben dem Boxplot anzeigen (leicht versetzt)
                    const xValues = xCategoryArray || [...new Set(groupData.map(p => getXValue(p)))];
                    const meanXs = [];
                    const meanYs = [];
                    xValues.forEach(xv => {
                        const vals = groupData
                            .filter(p => getXValue(p) === xv)
                            .map(p => getValue(p, yKey));
                        const { mean, n } = meanAndCi(vals);
                        if (n > 1) {
                            meanXs.push(xv); // Kein Offset mehr, direkt über Box
                            meanYs.push(mean);
                        }
                    });
                    if (meanXs.length > 0) {
                        traces.push({
                            x: meanXs,
                            y: meanYs,
                            type: 'scatter',
                            mode: 'markers',
                            name: `${typ} Mittelwert`,
                            marker: { color: '#111', size: 4.5, symbol: 'circle', line: { color: '#111', width: 1 } },
                            showlegend: false,
                            hoverinfo: 'skip'
                        });
                    }
                }
            });

            if (chartMode !== 'mean-ci') {
                traces.push({
                    x: [0],
                    y: [0],
                    type: 'scatter',
                    mode: 'markers',
                    name: 'N1',
                    marker: { symbol: 'square', color: '#6b7280', size: 8 },
                    legendgroup: 'aufwuchs',
                    showlegend: true,
                    visible: 'legendonly'
                });
                traces.push({
                    x: [0],
                    y: [0],
                    type: 'scatter',
                    mode: 'markers',
                    name: 'N2+',
                    marker: { symbol: 'diamond', color: '#6b7280', size: 8 },
                    legendgroup: 'aufwuchs',
                    showlegend: true,
                    visible: 'legendonly'
                });
            }

            if (container.removeAllListeners) {
                container.removeAllListeners('plotly_click');
            }
            Plotly.newPlot(container, traces, {
                title: 'Futter-Analyse',
                yaxis: { title: formatYAxisTitle(yKey) },
                boxmode: chartMode === 'mean-ci' ? undefined : 'group',
                width: plotWidth,
                xaxis: {
                    title: formatXAxisTitle(xKey),
                    automargin: true,
                    tickangle: fitAllOnScreen ? -60 : -30,
                    tickfont: fitAllOnScreen ? { size: 9 } : undefined,
                    type: (xKey === 'probeNr' || xKey === 'futterartAufwuchs') ? 'category' : undefined,
                    categoryorder: (xKey === 'probeNr' || xKey === 'futterartAufwuchs') ? 'array' : undefined,
                    categoryarray: xCategoryArray
                },
                margin: { l: 60, r: 20, t: 120, b: 120 },
                legend: {
                    orientation: 'h',
                    yanchor: 'top',
                    y: 1.18,
                    xanchor: 'center',
                    x: 0.5,
                    itemwidth: 60,
                    title: {text: ''},
                    font: {size: 13}
                }
            }, {responsive: true}).then(() => {
                container.on('plotly_click', handlePointClick);
            });

            renderTable(filtered);
            renderInputTable(filtered);
        }

        function getValue(obj, path) {
            if(!path) return undefined;
            return path.split('.').reduce((o, i) => (o ? o[i] : undefined), obj);
        }


        function getProbeNrSuffix(probeNr) {
            const v = (probeNr || '').toString();
            const idx = v.indexOf('_');
            if (idx === -1 || idx === v.length - 1) return v;
            return v.slice(idx + 1).trim();
        }

        function getProbePrefix(probeNr) {
            const v = (probeNr || '').toString();
            const idx = v.indexOf('_');
            if (idx === -1) return v.trim();
            return v.slice(0, idx).trim();
        }

        function updatePrefixOptions() {
            const input = document.getElementById('filter-prefix');

            const counts = new Map();
            (alleProben || []).forEach(p => {

                if (!prefix) return;
                counts.set(prefix, (counts.get(prefix) || 0) + 1);
            });
            const current = input.value || '';
            const options = Array.from(counts.entries())
                .filter(([, cnt]) => cnt >= 6)
                .map(([prefix, cnt]) => ({ prefix, cnt }))
                .sort((a, b) => a.prefix.localeCompare(b.prefix, 'de', { numeric: true }));

            prefixOptions = options;
            if (current) input.value = current;
            renderPrefixMenu(current);
        }

        function meanAndCi(values) {
            const nums = values.filter(v => typeof v === 'number' && !Number.isNaN(v));
            const n = nums.length;
            if (!n) return { mean: null, ci: null, n: 0 };
            const mean = nums.reduce((a, b) => a + b, 0) / n;
            if (n < 2) return { mean, ci: 0, n };
            const variance = nums.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
            const sd = Math.sqrt(variance);
            const ci = 1.96 * (sd / Math.sqrt(n));
            return { mean, ci, n };
        }


        function withAlpha(rgba, alpha) {
            if (typeof rgba !== 'string') return rgba;
            if (!rgba.startsWith('rgba')) return rgba;
            const parts = rgba.replace('rgba(', '').replace(')', '').split(',').map(p => p.trim());
            if (parts.length < 3) return rgba;
            return `rgba(${parts[0]}, ${parts[1]}, ${parts[2]}, ${alpha})`;
        }

        function normalizeIntegerInputValue(id) {
            const el = document.getElementById(id);
            if (!el) return '';
            const raw = (el.value || '').toString().trim();
            if (!raw) {
                el.value = '';
                return '';
            }
            const parsed = parseInt(raw, 10);
            if (!Number.isFinite(parsed)) {
                el.value = '';
                return '';
            }
            const max = id === 'edit-aufwuchs_nr' ? 9 : Number.POSITIVE_INFINITY;
            const safe = Math.min(max, Math.max(0, parsed));
            el.value = String(safe);
            return el.value;
        }

        function adjustIntegerField(id, delta) {
            const el = document.getElementById(id);
            if (!el) return;
            const currentRaw = normalizeIntegerInputValue(id);
            const current = currentRaw === '' ? 0 : parseInt(currentRaw, 10);
            const max = id === 'edit-aufwuchs_nr' ? 9 : Number.POSITIVE_INFINITY;
            const next = Math.min(max, Math.max(0, current + delta));
            el.value = String(next);
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function renderJsonTable(containerId, obj, editable=false) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const rows = Object.entries(obj || {}).map(([k, v]) => {
                const type = Array.isArray(v) ? 'array' : (v === null ? 'null' : typeof v);
                if (!editable) {
                    const val = (v !== null && typeof v === 'object') ? JSON.stringify(v) : String(v ?? '');
                    return `<tr class="border-t">
                        <td class="px-3 py-2 text-xs text-gray-600 font-semibold whitespace-nowrap">${k}</td>
                        <td class="px-3 py-2 text-xs text-gray-800">${val}</td>
                    </tr>`;
                }

                let inputHtml = '';
                if (type === 'boolean') {
                    inputHtml = `
                        <select class="w-full border p-1 rounded text-xs" data-key="${k}" data-type="boolean">
                            <option value="true" ${v === true ? 'selected' : ''}>true</option>
                            <option value="false" ${v === false ? 'selected' : ''}>false</option>
                        </select>
                    `;
                } else if (type === 'object' || type === 'array') {
                    inputHtml = `<textarea class="w-full border p-1 rounded text-xs font-mono" rows="3" data-key="${k}" data-type="${type}">${JSON.stringify(v ?? {}, null, 2)}</textarea>`;
                } else if (type === 'number') {
                    inputHtml = `<input type="number" class="w-full border p-1 rounded text-xs" data-key="${k}" data-type="number" value="${v ?? ''}">`;
                } else if (type === 'null') {
                    inputHtml = `<input type="text" class="w-full border p-1 rounded text-xs" data-key="${k}" data-type="null" value="">`;
                } else {
                    inputHtml = `<input type="text" class="w-full border p-1 rounded text-xs" data-key="${k}" data-type="string" value="${v ?? ''}">`;
                }

                return `<tr class="border-t">
                    <td class="px-3 py-2 text-xs text-gray-600 font-semibold whitespace-nowrap">${k}</td>
                    <td class="px-3 py-2 text-xs text-gray-800">${inputHtml}</td>
                </tr>`;
            });
            container.innerHTML = rows.length
                ? `<table class="min-w-full text-left"><tbody>${rows.join('')}</tbody></table>`
                : `<div class="text-xs text-gray-500">Keine Daten</div>`;
        }

        function collectJsonFromTable(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return {};
            const result = {};
            container.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                const type = el.getAttribute('data-type') || 'string';
                const raw = (el.value ?? '').toString().trim();
                if (!key) return;
                if (type === 'number') {
                    const n = parseFloat(raw);
                    if (Number.isNaN(n)) throw new Error('number');
                    result[key] = n;
                } else if (type === 'boolean') {
                    if (raw !== 'true' && raw !== 'false') throw new Error('boolean');
                    result[key] = raw === 'true';
                } else if (type === 'object' || type === 'array') {
                    if (!raw) {
                        result[key] = type === 'array' ? [] : {};
                    } else {
                        result[key] = JSON.parse(raw);
                    }
                } else if (type === 'null') {
                    result[key] = raw ? raw : null;
                } else {
                    result[key] = raw;
                }
            });
            return result;
        }

        function formatValue(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'number' && !Number.isNaN(val)) return val.toFixed(2);
            return String(val);
        }

        function applyTableFilters(rows) {
            const filters = tableFilters || {};
            return rows.filter(r => {
                return Object.keys(filters).every(key => {
                    const f = (filters[key] || '').toString().trim().toLowerCase();
                    if (!f) return true;
                    const v = getValue(r, key);
                    return (v === null || v === undefined)
                        ? false
                        : String(v).toLowerCase().includes(f);
                });
            });
        }

        function sortRows(rows) {
            const { key, dir } = tableSort;
            const mul = dir === 'asc' ? 1 : -1;
            return [...rows].sort((a, b) => {
                const va = getValue(a, key);
                const vb = getValue(b, key);
                if (key === 'probeNr') {
                    return String(va ?? '').localeCompare(String(vb ?? ''), 'de', { numeric: false }) * mul;
                }
                const na = typeof va === 'number' && !Number.isNaN(va);
                const nb = typeof vb === 'number' && !Number.isNaN(vb);
                if (na && nb) return (va - vb) * mul;
                return String(va ?? '').localeCompare(String(vb ?? ''), 'de', { numeric: true }) * mul;
            });
        }

        function renderTable(rows) {
            const cols = getTableColumns();
            const headRow = document.getElementById('data-table-head');
            const filterRow = document.getElementById('data-table-filters');
            const body = document.getElementById('data-table-body');
            const info = document.getElementById('data-table-info');
            const isAdmin = localStorage.getItem('agffAdminUnlocked') === '1';

            if (!headRow || !filterRow || !body) return;

            headRow.innerHTML = cols.map(c => {
                const isActive = tableSort.key === c.key;
                const dir = isActive ? (tableSort.dir === 'asc' ? '▲' : '▼') : '';
                return `<th class="px-3 py-2 text-left text-xs font-semibold text-gray-700 cursor-pointer" data-key="${c.key}">
                    ${c.label} <span class="text-gray-400">${dir}</span>
                </th>`;
            }).join('');

            filterRow.innerHTML = cols.map(c => {
                const val = tableFilters[c.key] || '';
                return `<th class="px-2 py-2">
                    <input data-key="${c.key}" value="${val}" placeholder="Filter" class="w-full border p-1 rounded text-xs" />
                </th>`;
            }).join('');

            const filtered = applyTableFilters(rows);
            const sorted = sortRows(filtered);

            body.innerHTML = sorted.map((r, idx) => {
                return `<tr class="border-t hover:bg-gray-50 cursor-pointer" data-row-idx="${idx}">
                    ${cols.map(c => {
                        let v = getValue(r, c.key);
                        if (!isAdmin && c.key === 'beurteiler') v = '***';
                        return `<td class="px-3 py-2 text-xs text-gray-700 whitespace-nowrap">${formatValue(v)}</td>`;
                    }).join('')}
                </tr>`;
            }).join('');

            if (info) info.textContent = `${sorted.length} von ${rows.length} Einträgen`;

            headRow.querySelectorAll('th[data-key]').forEach(th => {
                th.addEventListener('click', () => {
                    const k = th.getAttribute('data-key');
                    if (tableSort.key === k) {
                        tableSort.dir = tableSort.dir === 'asc' ? 'desc' : 'asc';
                    } else {
                        tableSort.key = k;
                        tableSort.dir = 'asc';
                    }
                    renderTable(rows);
                });
            });

            filterRow.querySelectorAll('input[data-key]').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    const k = e.target.getAttribute('data-key');
                    tableFilters[k] = e.target.value;
                    renderTable(rows);
                });
            });

            body.querySelectorAll('tr[data-row-idx]').forEach(tr => {
                tr.addEventListener('click', () => {
                    const idx = Number(tr.getAttribute('data-row-idx'));
                    const sample = sorted[idx];
                    if (sample) openEditModal(sample);
                });
            });
        }

        function getInputTableColumns() {
            return [
                { key: 'probeNr', label: 'Probe' },
                { key: 'beurteiler', label: 'Beurteiler' },
                { key: 'erstelltAm', label: 'Datum' },
                { key: 'eingaben.probe_lieferant', label: 'Probe-Lieferant' },
                { key: 'eingaben.futterart', label: 'Futterart' },
                { key: 'eingaben.aufwuchs_nr', label: 'Aufwuchs Nr.' },
                { key: 'eingaben.sorte', label: 'Sorte' },
                { key: 'eingaben.gps_kultur', label: 'GPS Kultur' },
                { key: 'eingaben.gps_leguminosenanteil', label: 'GPS Leguminosenanteil' },
                { key: 'eingaben.postleitzahl', label: 'PLZ' },
                { key: 'eingaben.hoehe_ueber_meer', label: 'Höhe m' },
                { key: 'eingaben.schnittdatum', label: 'Schnittdatum' },
                { key: 'eingaben.chargenbeschreibung', label: 'Chargenbeschreibung' },
                { key: 'eingaben.silomais_kolbenanteil', label: 'Kolbenanteil' },
                { key: 'eingaben.silomais_powermais', label: 'Powermais' },
                { key: 'eingaben.silomais_schnitthoehe_50', label: 'Schnitthöhe >50' },
                { key: 'eingaben.laboranalyse_vorliegend', label: 'Laboranalyse' },
                { key: 'eingaben.geplante_verwertung', label: 'Verwertung' }
            ];
        }

        function applyInputTableFilters(rows) {
            const filters = inputTableFilters || {};
            return rows.filter(r => {
                return Object.keys(filters).every(key => {
                    const f = (filters[key] || '').toString().trim().toLowerCase();
                    if (!f) return true;
                    const v = getValue(r, key);
                    return (v === null || v === undefined)
                        ? false
                        : String(v).toLowerCase().includes(f);
                });
            });
        }

        function sortInputRows(rows) {
            const { key, dir } = inputTableSort;
            const mul = dir === 'asc' ? 1 : -1;
            return [...rows].sort((a, b) => {
                const va = getValue(a, key);
                const vb = getValue(b, key);
                if (key === 'probeNr') {
                    return String(va ?? '').localeCompare(String(vb ?? ''), 'de', { numeric: false }) * mul;
                }
                const na = typeof va === 'number' && !Number.isNaN(va);
                const nb = typeof vb === 'number' && !Number.isNaN(vb);
                if (na && nb) return (va - vb) * mul;
                return String(va ?? '').localeCompare(String(vb ?? ''), 'de', { numeric: true }) * mul;
            });
        }

        function renderInputTable(rows) {
            const cols = getInputTableColumns();
            const headRow = document.getElementById('input-table-head');
            const filterRow = document.getElementById('input-table-filters');
            const body = document.getElementById('input-table-body');
            const info = document.getElementById('input-table-info');
            const isAdmin = localStorage.getItem('agffAdminUnlocked') === '1';

            if (!headRow || !filterRow || !body) return;

            headRow.innerHTML = cols.map(c => {
                const isActive = inputTableSort.key === c.key;
                const dir = isActive ? (inputTableSort.dir === 'asc' ? '▲' : '▼') : '';
                return `<th class="px-3 py-2 text-left text-xs font-semibold text-gray-700 cursor-pointer" data-key="${c.key}">
                    ${c.label} <span class="text-gray-400">${dir}</span>
                </th>`;
            }).join('');

            filterRow.innerHTML = cols.map(c => {
                const val = inputTableFilters[c.key] || '';
                return `<th class="px-2 py-2">
                    <input data-key="${c.key}" value="${val}" placeholder="Filter" class="w-full border p-1 rounded text-xs" />
                </th>`;
            }).join('');

            const filtered = applyInputTableFilters(rows);
            const sorted = sortInputRows(filtered);

            body.innerHTML = sorted.map((r, idx) => {
                return `<tr class="border-t hover:bg-gray-50 cursor-pointer" data-row-idx="${idx}">
                    ${cols.map(c => {
                        let v = getValue(r, c.key);
                        if (!isAdmin && c.key === 'beurteiler') v = '***';
                        return `<td class="px-3 py-2 text-xs text-gray-700 whitespace-nowrap">${formatValue(v)}</td>`;
                    }).join('')}
                </tr>`;
            }).join('');

            if (info) info.textContent = `${sorted.length} von ${rows.length} Einträgen`;

            headRow.querySelectorAll('th[data-key]').forEach(th => {
                th.addEventListener('click', () => {
                    const k = th.getAttribute('data-key');
                    if (inputTableSort.key === k) {
                        inputTableSort.dir = inputTableSort.dir === 'asc' ? 'desc' : 'asc';
                    } else {
                        inputTableSort.key = k;
                        inputTableSort.dir = 'asc';
                    }
                    renderInputTable(rows);
                });
            });

            filterRow.querySelectorAll('input[data-key]').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    const k = e.target.getAttribute('data-key');
                    inputTableFilters[k] = e.target.value;
                    renderInputTable(rows);
                });
            });

            body.querySelectorAll('tr[data-row-idx]').forEach(tr => {
                tr.addEventListener('click', () => {
                    const idx = Number(tr.getAttribute('data-row-idx'));
                    const sample = sorted[idx];
                    if (sample) openEditModal(sample);
                });
            });
        }

        function renderSummaryTable(rows) {
            const headRow = document.getElementById('summary-table-head');
            const filterRow = document.getElementById('summary-table-filters');
            const body = document.getElementById('summary-table-body');
            const info = document.getElementById('summary-table-info');
            if (!headRow || !filterRow || !body) return;

            const cols = [
                { key: 'probeNr', label: 'Probe' },
                { key: 'futterart', label: 'Futterart' },
                { key: 'count', label: 'Anzahl' },
                { key: 'avg.nel', label: 'Ø NEL' },
                { key: 'avg.apde', label: 'Ø APDE' },
                { key: 'avg.apdn', label: 'Ø APDN' },
                { key: 'avg.mpp', label: 'Ø MPP' }
            ];

            const safeRows = Array.isArray(rows) ? rows : [];

            headRow.innerHTML = cols.map(c => {
                const isActive = summaryTableSort.key === c.key;
                const dir = isActive ? (summaryTableSort.dir === 'asc' ? '▲' : '▼') : '';
                return `<th class="px-3 py-2 text-left text-xs font-semibold text-gray-700 cursor-pointer" data-key="${c.key}">
                    ${c.label} <span class="text-gray-400">${dir}</span>
                </th>`;
            }).join('');

            filterRow.innerHTML = cols.map(c => {
                const val = summaryTableFilters[c.key] || '';
                return `<th class="px-2 py-2">
                    <input data-key="${c.key}" value="${val}" placeholder="Filter" class="w-full border p-1 rounded text-xs" />
                </th>`;
            }).join('');

            const filtered = safeRows.filter(r => {
                return Object.keys(summaryTableFilters).every(key => {
                    const f = (summaryTableFilters[key] || '').toString().trim().toLowerCase();
                    if (!f) return true;
                    const v = getValue(r, key);
                    return (v === null || v === undefined)
                        ? false
                        : String(v).toLowerCase().includes(f);
                });
            });

            const sorted = [...filtered].sort((a, b) => {
                const { key, dir } = summaryTableSort;
                const mul = dir === 'asc' ? 1 : -1;
                const va = getValue(a, key);
                const vb = getValue(b, key);
                if (key === 'probeNr') {
                    return String(va ?? '').localeCompare(String(vb ?? ''), 'de', { numeric: false }) * mul;
                }
                const na = typeof va === 'number' && !Number.isNaN(va);
                const nb = typeof vb === 'number' && !Number.isNaN(vb);
                if (na && nb) return (va - vb) * mul;
                return String(va ?? '').localeCompare(String(vb ?? ''), 'de', { numeric: true }) * mul;
            });

            body.innerHTML = sorted.map(r => {
                return `<tr class="border-t hover:bg-gray-50">
                    <td class="px-3 py-2 text-xs text-gray-700 whitespace-nowrap">${formatValue(r.probeNr)}</td>
                    <td class="px-3 py-2 text-xs text-gray-700 whitespace-nowrap">${formatValue(r.futterart)}</td>
                    <td class="px-3 py-2 text-xs text-gray-700 whitespace-nowrap">${formatValue(r.count)}</td>
                    <td class="px-3 py-2 text-xs text-gray-700 whitespace-nowrap">${formatValue(r.avg?.nel)}</td>
                    <td class="px-3 py-2 text-xs text-gray-700 whitespace-nowrap">${formatValue(r.avg?.apde)}</td>
                    <td class="px-3 py-2 text-xs text-gray-700 whitespace-nowrap">${formatValue(r.avg?.apdn)}</td>
                    <td class="px-3 py-2 text-xs text-gray-700 whitespace-nowrap">${formatValue(r.avg?.mpp)}</td>
                </tr>`;
            }).join('');

            if (info) info.textContent = `${sorted.length} von ${safeRows.length} Einträgen`;

            headRow.querySelectorAll('th[data-key]').forEach(th => {
                th.addEventListener('click', () => {
                    const k = th.getAttribute('data-key');
                    if (summaryTableSort.key === k) {
                        summaryTableSort.dir = summaryTableSort.dir === 'asc' ? 'desc' : 'asc';
                    } else {
                        summaryTableSort.key = k;
                        summaryTableSort.dir = 'asc';
                    }
                    renderSummaryTable(rows);
                });
            });

            filterRow.querySelectorAll('input[data-key]').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    const k = e.target.getAttribute('data-key');
                    summaryTableFilters[k] = e.target.value;
                    renderSummaryTable(rows);
                });
            });
        }

                            <select id="edit-futterart" class="w-full border p-2 rounded bg-white">
                                <option value="">-- Bitte wählen --</option>
                                <option value="Wiesenfutter">Wiesenfutter</option>
                                <option value="Silomais">Silomais</option>
                                <option value="Ganzpflanzensilage (GPS)">Ganzpflanzensilage (GPS)</option>
                                <option value="Zuckerrüben-Schnitzel">Zuckerrüben-Schnitzel</option>
                                <option value="Malztreber">Malztreber</option>
                            </select>
                        </div>

                        <div class="md:col-span-2 grid grid-cols-[96px_minmax(0,1fr)] gap-2 items-end">
                            <div><label class="text-gray-600">Postleitzahl</label><input id="edit-postleitzahl" maxlength="5" inputmode="numeric" class="w-full border p-2 rounded"></div>
                            <div><label class="text-gray-600">Höhe über Meer</label><input id="edit-hoehe_ueber_meer" class="w-full border p-2 rounded"></div>
                        </div>

                        <div id="edit-row-aufwuchs-schnitt" class="md:col-span-2 grid grid-cols-2 gap-2 items-end">
                            <div id="edit-row-aufwuchs-nr">
                                <label class="text-gray-600">Aufwuchs Nr.</label>
                                <div class="flex items-center gap-2">
                                    <button type="button" id="edit-aufwuchs-nr-minus" class="px-2 py-1 bg-gray-200 text-gray-800 rounded font-bold leading-none hover:bg-gray-300" aria-label="Aufwuchs Nr. verringern">-</button>
                                    <input id="edit-aufwuchs_nr" type="number" min="0" max="9" step="1" inputmode="numeric" class="w-full border p-2 rounded text-center">
                                    <button type="button" id="edit-aufwuchs-nr-plus" class="px-2 py-1 bg-gray-200 text-gray-800 rounded font-bold leading-none hover:bg-gray-300" aria-label="Aufwuchs Nr. erhöhen">+</button>
                                </div>
                            </div>
                            <div id="edit-row-schnittdatum"><label class="text-gray-600">Schnittdatum</label><input id="edit-schnittdatum" type="date" class="w-full border p-2 rounded"></div>
                        </div>

                        <div id="edit-row-sorte"><label class="text-gray-600">Sorte</label><input id="edit-sorte" class="w-full border p-2 rounded"></div>
                        <div id="edit-row-gps-kultur"><label class="text-gray-600">GPS Kultur</label><input id="edit-gps_kultur" class="w-full border p-2 rounded"></div>
                        <div id="edit-row-gps-leguminosenanteil"><label class="text-gray-600">GPS Leguminosenanteil</label><input id="edit-gps_leguminosenanteil" class="w-full border p-2 rounded"></div>
                        <div id="edit-row-silomais-kolbenanteil"><label class="text-gray-600">Silomais Kolbenanteil</label><input id="edit-silomais_kolbenanteil" class="w-full border p-2 rounded"></div>
                        <label id="edit-row-silomais-powermais" class="flex items-center gap-2 mt-5"><input type="checkbox" id="edit-silomais_powermais" class="accent-green-600"><span>Powermais</span></label>
                        <label id="edit-row-silomais-schnitthoehe" class="flex items-center gap-2 mt-5"><input type="checkbox" id="edit-silomais_schnitthoehe_50" class="accent-green-600"><span>Schnitthöhe &gt; 50 cm</span></label>
                        <div><label class="text-gray-600">Chargenbeschreibung</label><input id="edit-chargenbeschreibung" class="w-full border p-2 rounded"></div>
                        <div>
                            <label class="text-gray-600">Geplante Verwertung</label>
                            <select id="edit-geplante_verwertung" class="w-full border p-2 rounded bg-white">
                                <option value="">-- Bitte wählen --</option>
                                <option value="Milchkühe">Milchkühe</option>
                                <option value="Mutterkühe">Mutterkühe</option>
                                <option value="Kälber">Kälber</option>
                                <option value="Rinder">Rinder</option>
                                <option value="Pferde">Pferde</option>
                                <option value="Schafe">Schafe</option>
                                <option value="Ziege">Ziege</option>
                                <option value="anderes">Anderes</option>
                                <option value="nicht verwenden">Nicht verwenden</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="border rounded">
                <button id="edit-section-beurteilung-btn" class="w-full flex items-center justify-between px-3 py-2 text-sm font-semibold" aria-expanded="false" type="button">
                    Beurteilung
                    <span>▼</span>
                </button>
                <div id="edit-section-beurteilung" class="px-3 pb-3 hidden">
                    <div class="mt-2 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="text-gray-600">Aufwuchs</label>
                            <select id="edit-aufwuchs" class="w-full border p-2 rounded bg-white">
                                <option value="">--</option>
                                <option value="erster">1. Aufwuchs</option>
                                <option value="folge">Folgeaufwuchs</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-gray-600">Bestand</label>
                            <select id="edit-bestand" class="w-full border p-2 rounded bg-white">
                                <option value="">--</option>
                                <option value="G">G</option>
                                <option value="GR">GR</option>
                                <option value="A">A</option>
                                <option value="AR">AR</option>
                                <option value="L">L</option>
                                <option value="KF">KF</option>
                                <option value="KG">KG</option>
                            </select>
                        </div>
                        <div><label class="text-gray-600">Stadium (Code)</label><input id="edit-stadium" class="w-full border p-2 rounded"></div>
                        <div><label class="text-gray-600">Stadium (Label)</label><input id="edit-stadiumLabel" class="w-full border p-2 rounded"></div>
                        <div>
                            <label class="text-gray-600">Konservierung</label>
                            <select id="edit-konservierung" class="w-full border p-2 rounded bg-white">
                                <option value="">--</option>
                                <option value="greenfeed">Grünfutter</option>
                                <option value="silage">Silage</option>
                                <option value="hay">Dürrfutter</option>
                            </select>
                        </div>
                        <div><label class="text-gray-600">Kuhgewicht</label><input id="edit-kuhGewicht" class="w-full border p-2 rounded"></div>
                        <div><label class="text-gray-600">TSV Override</label><input id="edit-tsvOverride" class="w-full border p-2 rounded"></div>
                        <div><label class="text-gray-600">Freie Korrektur</label><input id="edit-freie_korrektur" class="w-full border p-2 rounded"></div>
                        <div class="md:col-span-2"><label class="text-gray-600">Kommentar</label><textarea id="edit-kommentar_beurteilung" rows="3" class="w-full border p-2 rounded"></textarea></div>
                    </div>
                    <div class="mt-3 border rounded bg-gray-50 p-2">
                        <div class="text-xs font-semibold text-gray-700 mb-1">Ergebnisse (JSON)</div>
                        <div id="edit-ergebnisse-table"></div>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <p id="edit-status" class="text-xs"></p>
                <div class="flex gap-2">
                    <button id="edit-archive" class="px-3 py-2 rounded border border-yellow-400 text-yellow-700">Archivieren</button>
                    <button id="edit-delete" class="px-3 py-2 rounded border border-red-500 text-red-600">Löschen</button>
                    <button id="edit-cancel" class="px-3 py-2 rounded border">Abbrechen</button>
                    <button id="edit-save" class="px-3 py-2 rounded bg-green-600 text-white">Speichern</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
