<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergebnisse</title>
    <base href="/futter/">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🐮</span>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-gray-800">Ergebnisse anzeigen</h1>
                    <p class="text-xs text-gray-500">Zusammenfassung pro Probebezeichnung</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="./" class="text-gray-500 hover:text-gray-700" title="Startseite" aria-label="Startseite">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10.5l9-7 9 7M5.25 9.75V20.25H18.75V9.75"></path></svg>
                </a>
                <a href="./" class="text-sm text-blue-600 hover:text-blue-800">Zurück</a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 grid grid-cols-1 md:grid-cols-[auto_10rem_auto_1fr_auto_12rem_auto] md:items-center gap-3">
            <label class="text-sm font-medium text-gray-700">Futterart:</label>
            <select id="filterFutterart" class="w-full p-2 border rounded focus:ring-2 focus:ring-green-500 bg-white">
                <option value="alle">Alle</option>
                <option value="greenfeed">Grünfutter</option>
                <option value="silage">Silage</option>
                <option value="hay">Dürrfutter</option>
            </select>
            <label for="filterAnlass" class="text-sm font-medium text-gray-700">Anlass:</label>
            <input id="filterAnlass" type="text" placeholder="z.B. RW2026" class="w-full p-2 border rounded focus:ring-2 focus:ring-green-500 bg-white">
            <label for="filterDatum" class="text-sm font-medium text-gray-700">Datum:</label>
            <input id="filterDatum" type="date" class="w-full p-2 border rounded focus:ring-2 focus:ring-green-500 bg-white">
            <button id="resetFiltersBtn" type="button" class="px-3 py-2 border border-gray-300 rounded text-sm font-medium text-gray-700 hover:bg-gray-50">Zurücksetzen</button>
        </div>

        <div id="resultsContainer" class="space-y-3"></div>
    </main>

    <script>
        const container = document.getElementById('resultsContainer');
        const filter = document.getElementById('filterFutterart');
        const filterAnlass = document.getElementById('filterAnlass');
        const filterDatum = document.getElementById('filterDatum');
        const resetFiltersBtn = document.getElementById('resetFiltersBtn');
        let currentRows = [];

        filter.addEventListener('change', loadResults);
        filterAnlass.addEventListener('input', renderResults);
        filterDatum.addEventListener('change', renderResults);
        resetFiltersBtn.addEventListener('click', resetFilters);
        document.addEventListener('DOMContentLoaded', initResultsPage);

        function getAnlassFromProbeNr(probeNr) {
            const value = (probeNr || '').trim();
            if (!value) return '';
            if (!value.includes('_')) return value;
            return value.split('_', 2)[0].trim();
        }

        function getDefaultAnlassFilter() {
            const storedAnlass = (localStorage.getItem('agffProbeAnlass') || '').trim();
            if (storedAnlass) return storedAnlass;

            const lastProbeNr = (localStorage.getItem('agffLastProbeNr') || '').trim();
            return getAnlassFromProbeNr(lastProbeNr);
        }

        function initResultsPage() {
            filterAnlass.value = getDefaultAnlassFilter();
            loadResults();
        }

        function resetFilters() {
            filter.value = 'alle';
            filterAnlass.value = '';
            filterDatum.value = '';
            loadResults();
        }

        async function loadResults() {
            container.innerHTML = '<div class="text-sm text-gray-500">Lade...</div>';
            try {
                const response = await fetch(`api/results/summary?futterart=${encodeURIComponent(filter.value)}`);
                const data = await response.json();
                currentRows = Array.isArray(data) ? data : [];
                renderResults();
            } catch (e) {
                container.innerHTML = '<div class="text-sm text-red-600">Fehler beim Laden der Ergebnisse.</div>';
            }
        }

        function renderResults() {
            const anlassFilter = (filterAnlass.value || '').trim().toLowerCase();
            const datumFilter = (filterDatum.value || '').trim();
            const visibleRows = currentRows.filter((row) => {
                const anlassOk = !anlassFilter || getAnlassFromProbeNr(row.probeNr).toLowerCase() === anlassFilter;
                if (!anlassOk) return false;

                if (!datumFilter) return true;
                const details = Array.isArray(row.details) ? row.details : [];
                return details.some((detail) => (detail.datum || '').trim() === datumFilter);
            });

            if (!visibleRows.length) {
                container.innerHTML = '<div class="text-sm text-gray-500">Keine Daten gefunden.</div>';
                return;
            }

            container.innerHTML = visibleRows.map((row) => {
                    const avg = row.avg || {};
                    const details = Array.isArray(row.details) ? row.details : [];
                    return `
                        <details class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <summary class="cursor-pointer">
                                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2">
                                    <div>
                                        <div class="font-semibold text-gray-800">${row.probeNr}</div>
                                        <div class="text-xs text-gray-500">${row.futterartLabel || '-'} • ${row.count} Beurteilung(en)</div>
                                    </div>
                                    <div class="text-sm text-gray-700 grid grid-cols-2 md:grid-cols-5 gap-2">
                                        <div>NEL: <span class="font-semibold">${avg.nel?.toFixed(2) ?? '-'}</span></div>
                                        <div>NEV: <span class="font-semibold">${avg.nev?.toFixed(2) ?? '-'}</span></div>
                                        <div>APDE: <span class="font-semibold">${avg.apde?.toFixed(2) ?? '-'}</span></div>
                                        <div>APDN: <span class="font-semibold">${avg.apdn?.toFixed(2) ?? '-'}</span></div>
                                        <div>MPP: <span class="font-semibold">${avg.mpp?.toFixed(1) ?? '-'}</span></div>
                                    </div>
                                </div>
                            </summary>
                            <div class="mt-4 border-t pt-3">
                                <div class="text-sm font-semibold text-gray-700 mb-2">Einzelwerte</div>
                                <div class="overflow-x-auto">
                                    <table class="min-w-[520px] w-full text-sm">
                                        <thead>
                                            <tr class="text-left text-gray-500 border-b">
                                                <th class="py-2 pr-3">Datum</th>
                                                <th class="py-2 pr-3">NEL</th>
                                                <th class="py-2 pr-3">NEV</th>
                                                <th class="py-2 pr-3">APDE</th>
                                                <th class="py-2 pr-3">APDN</th>
                                                <th class="py-2 pr-3">MPP</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${details
                                                .filter(d => !datumFilter || ((d.datum || '').trim() === datumFilter))
                                                .map(d => `
                                                <tr class="border-b last:border-0">
                                                    <td class="py-2 pr-3">${d.datum || '-'}</td>
                                                    <td class="py-2 pr-3">${(d.nel ?? 0).toFixed(2)}</td>
                                                    <td class="py-2 pr-3">${(d.nev ?? 0).toFixed(2)}</td>
                                                    <td class="py-2 pr-3">${(d.apde ?? 0).toFixed(2)}</td>
                                                    <td class="py-2 pr-3">${(d.apdn ?? 0).toFixed(2)}</td>
                                                    <td class="py-2 pr-3">${(d.mpp ?? 0).toFixed(1)}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </details>
                    `;
                }).join('');
        }
    </script>
</body>
</html>
