services:
  futterrechner:
    build: .
    container_name: agff-futterrechner
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
      - ./static:/app/static
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # v2 Kursmodus: Versand der Anmeldecodes, Schlüssel für E-Mail-Adressen (Werte nur in .env)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - V2_SERVER_KEY=${V2_SERVER_KEY}
      # Kursleitung: freigeschaltete Adressen/Domains (kommagetrennt), Empfänger für Anträge
      - V2_KURSLEITUNG_EMAILS=${V2_KURSLEITUNG_EMAILS:-}
      - V2_KURSLEITUNG_DOMAINS=${V2_KURSLEITUNG_DOMAINS:-}
      - V2_ADMIN_MAIL=${V2_ADMIN_MAIL:-}
    networks:
      - web-netzwerk
    labels:
      - "traefik.enable=true"
      
      # REGEL 1: Routing
      # Wenn jemand die IP aufruft UND der Pfad mit /futter beginnt...
      # Host() ist Absicht: Ohne ihn antwortete der Router unter JEDEM
      # Hostnamen, der auf diesen Traefik zeigt.
      - "traefik.http.routers.futter.rule=Host(`apps.graswachstum.ch`) && PathPrefix(`/futter`)"
      # graswachstum.ch liegt in einem fremden DNS-Konto, daher HTTP-01
      # statt des Wildcard-Resolvers. Name ist serverspezifisch.
      - "traefik.http.routers.futter.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le-http}"
      - "traefik.http.routers.futter.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      
      # REGEL 2: Pfad bereinigen (Middleware)
      # Wichtig: Die Python-App erwartet "/", nicht "/futter".
      # Wir schneiden "/futter" ab, bevor wir die Anfrage an Python weitergeben.
      - "traefik.http.middlewares.futter-strip.stripprefix.prefixes=/futter"
      - "traefik.http.routers.futter.middlewares=futter-strip"
      
      # REGEL 3: Wohin?
      # Sende es an Port 5000 im Container
      - "traefik.http.services.futter.loadbalancer.server.port=5000"

networks:
  web-netzwerk:
    external: true
